body:
  text: 雙經沙門明得排定將釋此經文句大科分二初釋題二初正標題目金光二能說師號天台二入文二初定三分二初的指所傳此四二正判三分二初引諸師判二初總舉不同舊來二正明所判三初江北師江北二江南師江南三真諦師二初判文真諦二明義真諦二示今師意二初約理破諸師二初總斥人情今師二別示經意二初立意二初三分互通夫三二衆機遍益又衆二引經又法二據義分今部二初分經二初定三分文今從二示三分義二初正示序者二引經經曰二釋難二初立難疑者二通難三初引他經例衆經二明此經意斯乃三約今意結今從二釋三分三初序分二初品題金光二初釋序二初標三義序有二釋三義次緒二釋品二初舉梵翻名品者二就名釋義二初正釋品是二引例例如二經文二初分三序從如二釋三序三初次序二初泛論名數二初明數不同二初正明數開合次緒二兼示衆是非此經二立名多種二初例釋異名此之二結歸四悉天台二正釋經文二初明依經釋五義五初法體如是二初舊解二初引諸師釋四初舊解舊解二肇師肇師三真諦真諦四龍樹龍樹二以四悉判此之二今釋二初約教二初通釋今作二別釋三初迭明破立四初破邪立正二初破邪別釋二立正文如二破異立同二初破異今謂二明同摩訶三破淺明深二初破淺今謂二明深唯菩四破離立中二初破離今謂二明中文字二結成四教初破三示部具四此經二觀心觀心二聞持二初舊解三初舊師我聞二真諦真諦三釋論釋論二今釋二初約教釋二初我聞各釋二初明四義師釋二明四聞聞亦二我聞共釋三初聞者四能有四二能承四佛四初三藏歡喜二通教賢阿三別教典藏四圓教海阿三部有四機此經二觀心解觀解三和合一時二初舊解二初肇師一時二真諦二初敘彼立義三藏二章安釋成私謂二今釋二初約教二初約因緣總釋師釋二約諦智別釋二初釋時亦是二釋一而言二觀解觀解四教主佛二初舊解二初真諦佛者二釋論釋論二今釋二初約教天台二約觀觀解五住處住王二初雙標住者二雙釋二初明能住法二初舊解二初真諦真諦二釋論釋論二今釋二初教天台二觀觀解二明所住處二初城二初因緣釋王舍二觀行釋觀解二山二初因緣釋耆闍二觀行釋觀心二明闕同聞義二敘述序三發起序二正說分三流通分上明依經釋五義竟二明闕同聞義二初正釋此經二釋題若爾上明次序竟二敘述序二初列二名從是二釋二序二初泛示二序文相二初別相二初明七別二初示七經文別義二明七次第生起二明三別或時二述相二初正示敘述言敘二兼示敘人二初問起問誰二答示二初敘舊斥非舊云二重問的示二初的示師意又非二難起答通二初難起難者二答通二初以因況果此無二引文結證二初引當文證文云二引大品例大品二的從前序消文七初入定別二初標科釋入二隨釋三初能游人是時三初釋是時二初舊解是時二今釋今但二釋如來二初略示如來二解釋二初指他廣解三藏二今從要釋三初約悲智釋二初約義釋今言二引論證成論二約智行釋大經三約說證釋二初引論釋論二釋成今明三釋游字游者二所游法於無二初明深廣法性二初直約文釋二初消無量甚深無量二消法性二字法性二更取義釋三初取實智可照釋非是二就即事而理釋又無三引論等心類二初引類例如二準釋三初明中諦無量準此二明中必融攝若緣三結境智相稱此境二釋諸佛行處二初法諸佛二喻舉函三結過諸二初直約文釋二初據義略釋過諸二引文廣釋二初地持地持二淨名淨名二重取意釋亦是二敘述別三疑念別四現瑞別五騰疑念別六正疑別七集衆別上明入定別竟二敘述別二初述義異前是金二約文述義二初分文初十二述義二初敘四義四初敘名是金二初他解屬體解者二今定敘名今明二敘體諸經二初指上標今經王二對他辨正二初明他辨二初敘三藏二破二初明違教旨此語二明損行人作此二明今釋三初泛示諸部經王是非二初約三諦定是非二初示三諦今欲二定是非若說二就中道顯尊極三初明諸部圓體為王但經二約歷代人王為譬譬如三示隨部立名合譬法性二的明此典經王體性法性三特彰今釋契理益機若作三敘宗若有二初釋微妙微妙二釋四佛護持二初約教釋二初正釋二初釋四佛四方二釋護持二初約五佛體用釋持釋迦二約信相疑除釋護信相二揀示此一二約觀釋二初約諦約德立圓觀二初約四諦二初總明境智觀心二別示境智二初觀境東是二發智觀此二約四德又觀二約諦約德示佛名觀東四敘用二初分文我今二隨釋四初能破勝法我今二初依現文示二初示三法體初三二釋三法相二初別示二初別教若相二圓教若圓二總結雖圓二取新本示觀舊二所破惡罪二初重科總判二初科次從二判二初明轉報異餘經餘經二明三障由破戒一往二依科廣釋三初釋報障二初直約人道釋二初標示因果今直二驗果尋因五初殺生報諸根三初牒經示諸根二尋因驗昔損三引經證經云二偷盜報貧窮三初牒經示若貧二引經證經云三以事驗又先三淫欲報親厚三初牒經示若親二引經證經言三約理推昔侵四妄語報各各二初明經脫略各各二約義足釋二初足文示內則二約理推昔不五飲酒報財物二初例加文示外耗二推示因果二初正示昔慢二引證經言二廣約五乘釋二初約五戒違經問問釋二約五乘持戒答二初總答答開二別示二初約義釋二初以五戒配法體實淺深三初明人天二初引經提謂二配法二初別配二初周孔教二初對五常又對二對五經又對二輪王法三初開五對十相又對二示合七為二意俗不三結法從人